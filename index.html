<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>創正石膏磚 - 質量優越，引領綠色建造</title>
    <style>
        :root {
            --primary-green: #2E7D32;
            --pure-white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 🌟 已修正：將背景圖路徑改為讀取 bg1.png，支援高清全螢幕滿版與固定滾動特效 */
        body {
            background-image: url('bg1.png?v=2026');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #2D3748;
            padding: 30px 10px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* 1. 頂部公司 LOGO 區（保持放大置中、精緻毛玻璃透白底色） */
        .header-logo {
            background: rgba(255, 255, 255, 0.92); 
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(46, 125, 50, 0.08);
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
        }

        .header-logo img {
            max-height: 150px; 
            width: auto;
            max-width: 100%;
            display: block;
        }

        /* 文案大標題（加上半透明底色確保文字在圖片背景上清晰可讀） */
        .title-banner {
            text-align: center;
            margin-bottom: 35px;
            background: rgba(255, 255, 255, 0.85);
            padding: 15px 20px;
            border-radius: 12px;
            display: inline-block;
            left: 50%;
            transform: translateX(-50%);
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .title-banner h1 {
            font-size: 2.5rem;
            color: var(--primary-green);
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 6px;
        }

        .title-banner p {
            font-size: 1.3rem;
            color: #374151;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* 2. 核心圖片展示區 */
        .image-gallery {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-bottom: 50px;
            position: relative;
            clear: both;
        }

        .image-card {
            background: rgba(255, 255, 255, 0.95); /* 白色卡片微透，完美融入下方的綠意背景 */
            padding: 18px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .image-card img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
        }

        /* 3. 最下方聯繫方式與電郵 */
        .footer-contact {
            background: #1A202C;
            color: #E2E8F0;
            padding: 45px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0,0,0,0.12);
        }

        .footer-contact h3 {
            color: #FFF;
            margin-bottom: 15px;
            font-size: 1.6rem;
            letter-spacing: 1px;
        }

        .contact-box {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .contact-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 15px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .contact-btn:hover {
            transform: translateY(-3px);
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.35);
        }

        .btn-email {
            background-color: #4A5568;
            color: white;
            box-shadow: 0 6px 20px rgba(74, 85, 104, 0.35);
        }

        .copyright {
            margin-top: 35px;
            font-size: 0.88rem;
            color: #718096;
            border-top: 1px solid #2D3748;
            padding-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 頂部放大版公司 LOGO -->
    <header class="header-logo">
        <img src="logo.png?v=2026" alt="創正新型材料有限公司">
    </header>

    <!-- 文案標題 -->
    <div class="title-banner">
        <h1>創正石膏磚</h1>
        <p>質量優越，引領綠色建造</p>
    </div>

    <!-- 中間：5張產品圖片垂直順序排列 -->
    <main class="image-gallery">
        <div class="image-card">
            <img src="image5.jpg.jpeg?v=2026" alt="建造業議會 CIC 綠色產品認證 鉑金評級">
        </div>
        <div class="image-card">
            <img src="image1.jpg.jpeg?v=2026" alt="石膏磚產品型號與尺寸規格">
        </div>
        <div class="image-card">
            <img src="image4.jpg.jpeg?v=2026" alt="BS 5234 英國標準結構強度檢驗表">
        </div>
        <div class="image-card">
            <img src="image3.jpg.jpeg?v=2026" alt="專用配套輔料施工參數說明">
        </div>
        <div class="image-card">
            <img src="image2.jpg.jpeg?v=2026" alt="創正石膏黏接劑與膩子規格對比">
        </div>
    </main>

    <!-- 最下面：聯繫方式和電郵 -->
    <footer class="footer-contact">
        <h3>工程洽詢與項目報價</h3>
        <p>歡迎隨時聯絡我們，索取樣品或諮詢綠色建築建材方案。</p>
        
        <div class="contact-box">
            <a href="https://wa.me" class="contact-btn btn-whatsapp" target="_blank">
                💬 WhatsApp 聯絡: 67434046
            </a>
            <a href="mailto:chuangzheng0507@yahoo.com" class="contact-btn btn-email">
                ✉️ 電郵聯絡: chuangzheng0507@yahoo.com
            </a>
        </div>

        <div class="copyright">
            &copy; 創正新型材料有限公司 | 創正工程有限公司 版權所有
        </div>
    </footer>

</div>

</body>
</html>


</body>
</html>
