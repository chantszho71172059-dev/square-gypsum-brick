<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>創正石膏磚 - 質量優越，引領綠色建造</title>
    <style>
        :root {
            --primary-green: #2E7D32;
            --eco-bg: #f4faf6;
            --pure-white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 網頁環保建築主題背景：精緻的綠色永續建築結構幾何線條 */
        body {
            background-color: var(--eco-bg);
            background-image: 
                linear-gradient(rgba(46, 125, 50, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(46, 125, 50, 0.03) 1px, transparent 1px),
                radial-gradient(circle at 100% 0%, rgba(165, 214, 167, 0.15) 0%, transparent 60%);
            background-size: 40px 40px, 40px 40px, 100% 100%;
            background-attachment: fixed;
            color: #2D3748;
            padding: 20px 10px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* 1. 頂部公司 LOGO 區 */
        .header-logo {
            background: var(--pure-white);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(46, 125, 50, 0.1);
        }

        .header-logo img {
            max-height: 80px;
            width: auto;
            max-width: 100%;
            display: block;
        }

        /* 文案大標題 */
        .title-banner {
            text-align: center;
            margin-bottom: 35px;
        }

        .title-banner h1 {
            font-size: 2.3rem;
            color: var(--primary-green);
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .title-banner p {
            font-size: 1.25rem;
            color: #4A5568;
            font-weight: 500;
        }

        /* 2. 核心圖片展示區 */
        .image-gallery {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-bottom: 50px;
        }

        .image-card {
            background: var(--pure-white);
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.04);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .image-card img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        /* 3. 最下方聯繫方式與電郵 */
        .footer-contact {
            background: #1A202C;
            color: #E2E8F0;
            padding: 40px 20px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .footer-contact h3 {
            color: #FFF;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .contact-box {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .contact-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.05rem;
            transition: transform 0.2s;
        }

        .contact-btn:hover {
            transform: translateY(-2px);
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            box-shadow: 0 4px 14px rgba(37, 211, 102, 0.3);
        }

        .btn-email {
            background-color: #4A5568;
            color: white;
            box-shadow: 0 4px 14px rgba(74, 85, 104, 0.3);
        }

        .copyright {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #718096;
            border-top: 1px solid #2D3748;
            padding-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 頂部公司 LOGO -->
    <header class="header-logo">
        <img src="logo.png?v=2026" alt="創正新型材料有限公司">
    </header>

    <!-- 文案標題 -->
    <div class="title-banner">
        <h1>創正石膏磚</h1>
        <p>質量優越，引領綠色建造</p>
    </div>

    <!-- 中間：5張圖片垂直順序排列（加上版本號強迫繞過快取） -->
    <main class="image-gallery">
        <div class="image-card">
            <img src="image5.jpg.jpeg?v=2026" alt="建造業議會 CIC 綠色產品認證 鉑金評級">
        </div>
        <div class="image-card">
            <img src="image1.jpg.jpeg?v=2026" alt="石膏磚產品型號與尺寸規格">
        </div>
        <div class="image-card">
            <img src="image4.jpg.jpeg?v=2026" alt="BS 5234 英國標準結構強度檢驗表">
        </div>
        <div class="image-card">
            <img src="image3.jpg.jpeg?v=2026" alt="專用配套輔料施工參數說明">
        </div>
        <div class="image-card">
            <img src="image2.jpg.jpeg?v=2026" alt="創正石膏黏接劑與膩子規格對比">
        </div>
    </main>

    <!-- 最下面：聯繫方式和電郵 -->
    <footer class="footer-contact">
        <h3>工程洽詢與項目報價</h3>
        <p>歡迎隨時聯絡我們，索取樣品或諮詢綠色建築建材方案。</p>
        
        <div class="contact-box">
            <a href="https://wa.me" class="contact-btn btn-whatsapp" target="_blank">
                💬 WhatsApp 聯絡: 67434046
            </a>
            <a href="mailto:chuangzheng0507@yahoo.com" class="contact-btn btn-email">
                ✉️ 電郵聯絡: chuangzheng0507@yahoo.com
            </a>
        </div>

        <div class="copyright">
            &copy; 創正新型材料有限公司 | 創正工程有限公司 版權所有
        </div>
    </footer>

</div>

</body>
</html>
